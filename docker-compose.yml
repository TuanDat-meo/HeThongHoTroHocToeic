version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: toeic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: toeic_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend/toeic-api
    container_name: toeic-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend/toeic-web
    container_name: toeic-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata: